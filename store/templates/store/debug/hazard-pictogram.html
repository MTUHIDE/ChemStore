<!-- We extend the debug-subpage.html file -->
{% extends 'debug-subpage.html' %}

<!-- Static files need to be loaded on every template file -->
{% load static %}

<!--
The debug-subpage.html template already includes most of the table, so
we just need to specify the thead row and tbody rows
-->

{% block thead %}
    <tr>
        <th scope="col">PictogramID</th>
        <th scope="col">path</th>
        <th scope="col">image</th>
        <th scope="col">Description</th>
    </tr>
{%endblock%}

{%block tbody%}
    {% for item in model %}
        <tr>
            <td>{{ item.gh_code }}</td>
            <td>{{ item.pictogram }}</td>
            <td><img src="{{ item.pictogram.url }}"
                     alt="{{ item.description }}"
                     width="40"></td>
            <td>{{ item.description }}</td>
        </tr>
    {% endfor %}
{% endblock %}
