<!-- We extend the base.html file -->
{% extends 'base.html' %}

<!-- Static files need to be loaded on every template file -->
{% load static %}

<!-- Set the first part of title -->
{% block title %}Admin{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'store/css/gridTableLayout.css' %}">
{% endblock %}

{% block body %}
<div class="container text-center">
    <h1 class="display-4">Admin</h1>

    <div class="grid-table mx-auto px-3 border border-dark rounded">
        <div class="row row-cols-md-2 justify-content-around">
            <div class="col py-3">
                <a class="btn grid-table-btn" href="{% url 'store:admin_location' %}">
                    Locations
                </a>
            </div>
            <div class="col py-3">
                <a class="btn grid-table-btn" href="{% url 'store:admin_user' %}">
                    Users
                </a>
            </div>
            <div class="col py-3">
                <a class="btn grid-table-btn" href="{% url 'store:admin_department' %}">
                    Departments
                </a>
            </div>
            <div class="col py-3">
                <a class="btn grid-table-btn" href="{% url 'store:admin_role' %}">
                    Roles
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
