<!-- We extend the base.html file -->
{% extends 'base.html' %}

<!-- Static files need to be loaded on every template file -->
{% load static %}

<!-- Set the first part of title -->
{% block title %}Locations{% endblock %}

{% block body %}
<div class="container-fluid">
    <h1 class="display-5 text-center">Locations</h1>
        <h2 class="display-5 text-center">Test</h2>
            <div style="padding-left: 100px;">
                {% for item in model %}
                    <li>{{item.parent}} --> {{ item.name }}</li>

                    {% empty %}
                    <li><strong>Template works, but locations is empty</strong></li>
                {% endfor %}
            </div>
</div>
{% endblock %}
